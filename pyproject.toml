[project]
name = "backend-refresher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Josemiles-ctr", email = "josephotai37@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "jwt>=1.4.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib>=0.3.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.53.0",
]

[project.scripts]
backend-refresher = "backend_refresher:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
